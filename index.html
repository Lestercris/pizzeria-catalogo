<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b3261e">
  <title>Pizzería · Catálogo</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      background:#f4f4f6;color:#1b1b1f;font-size:16px;line-height:1.45;
      -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;text-rendering:optimizeSpeed}
    button,input,textarea,select{font:inherit;color:inherit}
    button{border:0;background:none;cursor:pointer;padding:0}
    button[disabled]{opacity:.55;pointer-events:none}
    [hidden]{display:none !important}
    img{max-width:100%;display:block}

    /* Topbar */
    .topbar{position:sticky;top:0;z-index:20;background:#b3261e;color:#fff;
      padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
    .brand{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .brand h1{font-size:18px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .logo-img,.logo-emoji{width:34px;height:34px;border-radius:50%;flex:0 0 auto;object-fit:cover;
      background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:18px}
    .btn-icono{position:relative;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);
      color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
    .btn-icono:active{background:rgba(255,255,255,.3)}
    .btn-admin{opacity:.55;font-size:14px}
    .btn-admin.on{opacity:1;background:#ffd400;color:#1b1b1f}
    .badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;
      border-radius:999px;background:#ffd400;color:#1b1b1f;font-size:11px;font-weight:800;
      display:flex;align-items:center;justify-content:center}
    .search input{width:100%;border:0;border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.16);color:#fff;outline:none}
    .search input::placeholder{color:rgba(255,255,255,.72)}
    .search input:focus{background:rgba(255,255,255,.26)}
    .chips{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:2px;
      -webkit-overflow-scrolling:touch;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.16);
      color:#fff;font-size:13px;white-space:nowrap}
    .chip[aria-pressed="true"]{background:#fff;color:#b3261e;font-weight:600}

    /* Hero */
    .hero{position:relative;background:#1b1b1f;overflow:hidden}
    .hero-track{display:flex;height:180px;overflow-x:auto;scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;scrollbar-width:none}
    @media(min-width:520px){.hero-track{height:220px}}
    @media(min-width:900px){.hero-track{height:280px}}
    .hero-track::-webkit-scrollbar{display:none}
    .hero-slide{flex:0 0 100%;height:100%;scroll-snap-align:start;position:relative;
      background-size:cover;background-position:center;background-color:#2a2a2e}
    .hero-slide::after{content:'';position:absolute;inset:0;
      background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.75) 100%);
      pointer-events:none}
    .hero-txt{position:absolute;left:0;right:0;bottom:0;z-index:1;color:#fff;padding:16px 16px 22px}
    .hero-txt h3{margin:0 0 2px;font-size:17px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.5);line-height:1.15}
    @media(min-width:640px){.hero-txt h3{font-size:22px}}
    .hero-txt p{margin:0;font-size:12.5px;opacity:.95;text-shadow:0 1px 3px rgba(0,0,0,.5)}
    @media(min-width:640px){.hero-txt p{font-size:14px}}
    .hero-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
      display:flex;gap:5px;z-index:2;pointer-events:none}
    .hero-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);transition:all .2s}
    .hero-dots span.on{background:#fff;width:16px;border-radius:3px}
    .hero:not(.visible){display:none}

    /* Grid */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px;
      padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
    @media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:16px}}
    .card{display:flex;flex-direction:column;background:#fff;border-radius:14px;overflow:hidden;
      border:1px solid #e6e6ea;text-align:left;contain:content;transition:transform .12s ease}
    .card:active{transform:scale(.98)}
    .thumb{position:relative;height:0;padding-bottom:66%;background:#eceef1;overflow:hidden}
    .thumb img,.detalle-media img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
    .thumb .ph,.detalle-media .ph{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;
      align-items:center;justify-content:center;color:#c9ccd1}
    .thumb .ph{font-size:34px}
    .card-body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
    .card-title{font-size:14px;font-weight:600;margin:0;line-height:1.25}
    .card-ing{font-size:12px;color:#6b6f76;margin:0;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
    .card-price{font-size:15px;font-weight:700;color:#b3261e}
    .card-btn{font-size:12px;font-weight:600;color:#b3261e;background:#fdecea;padding:4px 8px;border-radius:8px}

    /* Skeleton */
    @keyframes sk-shine{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .sk{background:linear-gradient(90deg,#eceef1 25%,#f6f7f9 50%,#eceef1 75%);
      background-size:200% 100%;animation:sk-shine 1.4s infinite linear;border-radius:8px}
    .sk-card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e6e6ea}
    .sk-thumb{height:0;padding-bottom:66%}
    .sk-body{padding:10px}
    .sk-line{height:10px;margin-bottom:8px}
    .estado{text-align:center;color:#8a8f98;padding:36px 24px;font-size:14px}

    /* Panels */
    .panel{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:#fff;
      display:flex;flex-direction:column;transform:translate3d(0,100%,0);visibility:hidden;
      transition:transform .26s ease, visibility 0s linear .26s;will-change:transform}
    .panel.abierto{transform:translate3d(0,0,0);visibility:visible;
      transition:transform .26s ease, visibility 0s}
    .panel-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
    .detalle-top{position:absolute;top:0;left:0;right:0;z-index:3;
      padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;display:flex;pointer-events:none}
    .detalle-top > *{pointer-events:auto}
    .btn-cerrar{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;
      font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center}
    .btn-cerrar:active{background:rgba(0,0,0,.75)}
    .detalle-media{position:relative;height:0;padding-bottom:42%;background:#eceef1;overflow:hidden}
    @media(min-width:640px){.detalle-media{padding-bottom:34%}}
    .detalle-media .ph{font-size:54px}
    .detalle-info{padding:14px}
    .badge-cat{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;
      text-transform:uppercase;color:#b3261e;background:#fdecea;padding:3px 8px;border-radius:999px}
    .detalle-info h2{font-size:19px;margin:8px 0 4px;line-height:1.2}
    .precio{font-size:21px;font-weight:800;color:#b3261e;margin:0 0 10px}
    .desc{font-size:13px;color:#4a4d53;margin:0 0 14px}
    .detalle-info h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;
      color:#8a8f98;margin:0 0 8px;font-weight:700}
    .ing{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:0 0 14px}
    .ing li{font-size:12px;background:#f4f4f6;border:1px solid #e6e6ea;padding:4px 9px;border-radius:999px}
    .nota{font-size:11px;color:#9a9ea6;margin:0}
    .variantes{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
    .variante{padding:7px 12px;border-radius:10px;border:1.5px solid #e0e0e6;background:#fff;
      font-size:12.5px;font-weight:600;color:#1b1b1f;display:flex;flex-direction:column;
      align-items:flex-start;gap:1px;min-width:82px}
    .variante small{font-size:11px;color:#8a8f98;font-weight:500}
    .variante[aria-pressed="true"]{border-color:#b3261e;background:#fdecea;color:#b3261e}
    .variante[aria-pressed="true"] small{color:#b3261e}
    .fila-cantidad{display:flex;align-items:center;justify-content:space-between;
      padding:10px 0;border-top:1px solid #f0f0f3;margin-top:4px}
    .fila-cantidad strong{font-size:13px;font-weight:600}
    .cant-ctrl{display:flex;align-items:center;gap:10px}
    .cant-btn{width:34px;height:34px;border-radius:50%;background:#f0f0f3;font-size:18px;font-weight:700;
      color:#1b1b1f;display:flex;align-items:center;justify-content:center}
    .cant-btn:active{background:#e2e2e8}
    .cant-num{min-width:26px;text-align:center;font-weight:800;font-size:16px}
    .panel-footer{padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
      border-top:1px solid #e6e6ea;background:#fff}
    .btn-primario{display:block;width:100%;padding:13px;background:#b3261e;color:#fff;border-radius:12px;
      font-weight:700;font-size:14px;text-align:center}
    .btn-primario:active{background:#8e1e18}

    /* Carrito */
    .carrito-top{position:static;background:#fff;border-bottom:1px solid #eee;
      padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;display:flex;align-items:center;gap:8px}
    .carrito-top .btn-cerrar{width:34px;height:34px;background:#f0f0f3;color:#1b1b1f;font-size:16px;flex:0 0 auto}
    .carrito-top .btn-cerrar:active{background:#e2e2e8}
    .carrito-titulo{flex:1;font-size:14px;font-weight:700;margin:0;text-align:center;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .btn-texto{font-size:12px;color:#b3261e;font-weight:600;padding:6px 6px;flex:0 0 auto}
    .logo-mini{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:#f0f0f3}
    .carrito-scroll{padding:10px 14px 0}
    .carrito-item{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px 0;
      border-bottom:1px solid #f0f0f3;align-items:center}
    .carrito-item:last-child{border-bottom:0}
    .ci-info{min-width:0}
    .ci-nombre{font-weight:600;font-size:13px;margin:0 0 1px;line-height:1.2}
    .ci-var{font-size:10.5px;color:#b3261e;font-weight:600;margin:0 0 1px}
    .ci-precio{font-size:11px;color:#8a8f98;margin:0}
    .ci-controls{display:flex;align-items:center;gap:5px}
    .ci-btn{width:28px;height:28px;border-radius:50%;background:#f0f0f3;font-size:14px;font-weight:700;
      color:#1b1b1f;display:flex;align-items:center;justify-content:center}
    .ci-btn:active{background:#e2e2e8}
    .ci-cant{min-width:18px;text-align:center;font-weight:700;font-size:13px}
    .ci-sub{font-weight:700;font-size:12px;min-width:54px;text-align:right;color:#b3261e;margin-left:2px}
    .carrito-vacio{text-align:center;padding:32px 20px;color:#8a8f98;font-size:13px}
    .carrito-vacio .icono{font-size:34px;display:block;margin-bottom:6px}
    .form-cliente{margin-top:10px;padding-top:12px;border-top:1px solid #e6e6ea;padding-bottom:6px}
    .form-cliente h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;
      color:#8a8f98;margin:0 0 8px;font-weight:700}
    .form-cliente label{display:block;margin-bottom:8px;font-size:11px;color:#6b6f76;font-weight:600}
    .form-cliente input{display:block;width:100%;margin-top:3px;padding:8px 10px;border:1px solid #e0e0e6;
      border-radius:8px;font-size:13px;background:#fafafb;outline:none;color:#1b1b1f}
    .form-cliente input:focus{border-color:#b3261e;background:#fff}
    .carrito-footer{padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
      border-top:1px solid #e6e6ea;background:#fff}
    .marca-footer{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;
      color:#8a8f98;font-size:11px;font-weight:600}
    .marca-footer img{width:20px;height:20px;border-radius:50%;object-fit:cover;background:#f0f0f3}
    .total-linea{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:8px}
    .total-linea strong{font-size:18px;color:#b3261e}
    .acciones-carrito{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btn-secundario,.btn-wa{padding:11px;border-radius:10px;font-weight:700;font-size:13px;
      text-align:center;display:block}
    .btn-secundario{background:#f0f0f3;color:#1b1b1f}
    .btn-secundario:active{background:#e2e2e8}
    .btn-wa{background:#25d366;color:#fff}
    .btn-wa:active{background:#1eb356}

    /* FAB */
    .fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;z-index:30;
      background:#b3261e;color:#fff;border-radius:999px;padding:11px 16px;font-weight:700;font-size:13.5px;
      box-shadow:0 6px 20px rgba(179,38,30,.35);display:flex;align-items:center;gap:6px;
      transform:translateY(90px);opacity:0;pointer-events:none;transition:transform .25s ease, opacity .25s ease}
    .fab.visible{transform:translateY(0);opacity:1;pointer-events:auto}
    .fab:active{background:#8e1e18}

    /* Toast */
    .toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom,0px));left:50%;
      transform:translate(-50%, 20px);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:999px;
      font-size:13px;font-weight:600;z-index:200;opacity:0;pointer-events:none;max-width:90vw;text-align:center;
      transition:opacity .2s, transform .2s}
    .toast.visible{opacity:1;transform:translate(-50%, 0)}

    /* Modales */
    .modal{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.5);display:flex;
      align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;
      transition:opacity .2s, visibility 0s linear .2s}
    .modal.abierto{opacity:1;visibility:visible;transition:opacity .2s, visibility 0s}
    .modal-card{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:90vh;
      overflow-y:auto;-webkit-overflow-scrolling:touch;transform:scale(.96);transition:transform .2s}
    .modal.abierto .modal-card{transform:scale(1)}
    .modal-card h3{margin:0 0 12px;font-size:17px}
    .modal-card input{width:100%;padding:11px;border:1px solid #e0e0e6;border-radius:10px;font-size:14px;
      background:#fafafb;outline:none;margin-bottom:10px}
    .modal-card input:focus{border-color:#b3261e;background:#fff}
    .modal-res{margin-bottom:12px;font-size:14px;min-height:20px}
    .modal-res .fila{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f3}
    .modal-res .fila:last-child{border:0}
    .modal-res .fila span:first-child{color:#8a8f98}
    .modal-acciones{display:flex;gap:8px}
    .modal-acciones button{flex:1;padding:11px;border-radius:10px;font-weight:700;font-size:14px}
    .modal-acciones .cancelar{background:#f0f0f3;color:#1b1b1f}
    .modal-acciones .ok{background:#b3261e;color:#fff}
    /* Admin panel */
    .admin-topbar{background:#1b1b1f;color:#fff;
      padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;display:flex;align-items:center;gap:8px}
    .admin-topbar .btn-cerrar{width:36px;height:36px;background:rgba(255,255,255,.16);color:#fff;flex:0 0 auto}
    .admin-topbar .btn-cerrar:active{background:rgba(255,255,255,.3)}
    .admin-topbar h2{flex:1;margin:0;font-size:15px;font-weight:700;text-align:center}
    .admin-topbar .btn-texto{color:#ffd400;font-size:12px}
    .admin-tabs-bar{display:flex;background:#f0f0f3;padding:4px;gap:4px}
    .admin-tab{flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:700;color:#6b6f76;text-align:center}
    .admin-tab.on{background:#fff;color:#b3261e;box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .admin-scroll{padding:10px 12px calc(20px + env(safe-area-inset-bottom,0px));background:#f4f4f6}
    .admin-add{margin-bottom:10px;padding:11px;background:#fff;border:1.5px dashed #b3261e;color:#b3261e;
      border-radius:12px;font-weight:700;font-size:13.5px;text-align:center;width:100%}
    .admin-add:active{background:#fdecea}
    .admin-lista{display:flex;flex-direction:column;gap:10px}
    .admin-row{background:#fff;border:1px solid #e6e6ea;border-radius:14px;padding:12px}
    .admin-head{display:grid;grid-template-columns:64px 1fr;gap:10px;margin-bottom:10px;align-items:start}
    .admin-thumb{width:64px;height:64px;border-radius:12px;background:#eceef1;overflow:hidden;
      position:relative;display:flex;align-items:center;justify-content:center;
      color:#c9ccd1;font-size:24px;cursor:pointer}
    .admin-thumb::after{content:'📷';position:absolute;bottom:0;right:0;font-size:12px;
      background:rgba(0,0,0,.6);color:#fff;padding:2px 5px;border-radius:8px 0 0 0}
    .admin-thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
    .admin-head-info{min-width:0}
    .admin-head-info .id{font-size:10.5px;color:#8a8f98;font-weight:700;text-transform:uppercase;
      letter-spacing:.5px;margin:0 0 2px}
    .admin-head-info .estado{font-size:10.5px;padding:2px 8px;border-radius:6px;font-weight:700;display:inline-block}
    .admin-head-info .estado.usando-var{background:#fff5e0;color:#946800}
    .admin-head-info .estado.usando-precio{background:#e8f7ec;color:#1a7a3a}
    .admin-head-info .estado.oculto{background:#fdecea;color:#b3261e}
    .admin-field{display:block;margin-bottom:8px}
    .admin-field span{display:block;font-size:11px;color:#6b6f76;font-weight:700;margin-bottom:3px;
      text-transform:uppercase;letter-spacing:.3px}
    .admin-field input,.admin-field textarea{width:100%;padding:9px 10px;border:1px solid #e0e0e6;
      border-radius:9px;font-size:13.5px;background:#fafafb;outline:none;color:#1b1b1f;
      font-family:inherit;resize:vertical}
    .admin-field input:focus,.admin-field textarea:focus{border-color:#b3261e;background:#fff}
    .admin-field textarea{min-height:44px;max-height:140px}
    .admin-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
    .admin-row-2 .admin-field{margin-bottom:0}
    .admin-acciones{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
    .admin-btn{font-size:12px;font-weight:700;padding:9px 8px;border-radius:9px;
      background:#f0f0f3;color:#1b1b1f;text-align:center}
    .admin-btn:active{background:#e2e2e8}
    .admin-btn.prim{background:#b3261e;color:#fff}
    .admin-btn.prim:active{background:#8e1e18}
    .admin-btn.ok{background:#e8f7ec;color:#1a7a3a}
    .admin-btn.danger{background:#fdecea;color:#b3261e}
    .admin-hint{font-size:11.5px;color:#6b6f76;margin:0 4px 10px;line-height:1.35;
      background:#fff;padding:9px 10px;border-radius:10px;border:1px solid #eceef1}
    .admin-empty{text-align:center;padding:24px 16px;color:#8a8f98;font-size:13px;background:#fff;
      border-radius:12px;border:1px solid #eceef1}

    :focus-visible{outline:2px solid #ffd400;outline-offset:2px}
    button:focus:not(:focus-visible){outline:none}

    @media (prefers-reduced-motion: reduce){
      .panel,.card,.fab,.toast,.modal,.modal-card,.hero-dots span{transition:none;animation:none}
      .sk{animation:none;background:#eceef1}
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span id="logo-box" class="logo-emoji">🍕</span>
      <h1 id="titulo">Pizzería</h1>
      <button id="btn-estado" class="btn-icono" type="button" aria-label="Consultar mi pedido">🔎</button>
      <button id="btn-admin" class="btn-icono btn-admin" type="button" aria-label="Administración">⚙️</button>
      <button id="btn-carrito-top" class="btn-icono" type="button" aria-label="Ver carrito">
        🛒<span id="badge" class="badge" hidden>0</span>
      </button>
    </div>
    <div class="search">

  <noscript>Activa JavaScript para ver el catálogo.</noscript>

  <script>
  (function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var gridEl = $('grid'), chipsEl = $('chips'), estadoEl = $('estado'), qEl = $('q');
    var detalleEl = $('detalle'), carritoEl = $('carrito'), panelAdminEl = $('panel-admin');
    var modalEst = $('modal-estado'), modalPin = $('modal-pin');
    var fabEl = $('fab'), toastEl = $('toast'), fileInput = $('file-input');

    var TODOS = [], CATEGORIAS = [], SLIDES = [];
    var CONFIG_APP = { negocio:'Pizzería', whatsapp:'', moneda:'$', logo:'', maxItems:40, maxCantidad:20 };
    var categoriaActiva = 'Todas', textoBusqueda = '', timerBusqueda = null;
    var CARRITO = [];
    var productoActual = null, varianteActual = null, cantidadActual = 1;
    var pedidoActualNumero = null, ultimoFoco = null;
    var PIN_ADMIN = null;
    var ADMIN_PRODUCTOS = null, ADMIN_SLIDES = null, adminTab = 'productos';
    var adminEditandoTipo = null, adminEditandoId = null, adminEditandoFila = null;

    var LS_CARRITO = 'pizzeria_carrito_v6';
    var LS_CLIENTE = 'pizzeria_cliente_v1';
    var LS_PEDIDO  = 'pizzeria_pedido_v1';

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function precio(n) {
      var v = Number(n) || 0, abs = Math.abs(v);
      var ent = Math.floor(abs), dec = Math.round((abs - ent) * 100);
      var t = String(ent).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return (v < 0 ? '-' : '') + (CONFIG_APP.moneda || '$') + t + (dec ? '.' + (dec < 10 ? '0' : '') + dec : '');
    }
    function padre(el, cls) {
      while (el && el !== document) {
        if (el.classList && el.classList.contains(cls)) return el;
        el = el.parentNode;
      }
      return null;
    }
    function claveItem(id, v) { return v ? id + '::' + v : id; }
    function leerLS(k, d) { try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : d; } catch (e) { return d; } }
    function escribirLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    function trapFocus(c, e) {
      var f = c.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }

    function iniciar() {
      CARRITO = leerLS(LS_CARRITO, []); if (!Array.isArray(CARRITO)) CARRITO = [];
      pedidoActualNumero = leerLS(LS_PEDIDO, null);
      var c = leerLS(LS_CLIENTE, {});
      $('c-nombre').value = c.nombre || '';
      $('c-telefono').value = c.telefono || '';
      $('c-direccion').value = c.direccion || '';
      $('c-notas').value = c.notas || '';
      pintarSkeletons();
      actualizarBadge();
      cargarCatalogo();
    }
    function cargarCatalogo() {
      google.script.run.withSuccessHandler(alRecibir).withFailureHandler(alFallar).getCatalogo();
    }
    function alRecibir(data) {
      TODOS = (data && data.productos) || [];
      CATEGORIAS = (data && data.categorias) || [];
      SLIDES = (data && data.slides) || [];
      CONFIG_APP = (data && data.config) || CONFIG_APP;
      aplicarMarca();
      pintarHero();
      if (!TODOS.length) {
        gridEl.innerHTML = '';
        estadoEl.hidden = false;
        estadoEl.textContent = 'No hay productos disponibles por ahora.';
        return;
      }
      estadoEl.hidden = true;
      pintarChips();
      pintarGrid();
      actualizarBadge();
    }
    function alFallar(err) {
      gridEl.innerHTML = '';
      estadoEl.hidden = false;
      estadoEl.textContent = 'No se pudo cargar el catálogo. Revisa tu conexión.';
      if (window.console) console.error(err);
    }
    function aplicarMarca() {
      if (CONFIG_APP.negocio) {
        $('titulo').textContent = CONFIG_APP.negocio;
        document.title = CONFIG_APP.negocio + ' · Catálogo';
        $('nombre-footer').textContent = CONFIG_APP.negocio;
      }
      if (CONFIG_APP.logo) {
        $('logo-box').outerHTML = '<img id="logo-box" class="logo-img" src="' + esc(CONFIG_APP.logo) + '" alt="Logo">';
        var lc = $('logo-carrito'); lc.src = CONFIG_APP.logo; lc.hidden = false;
        $('logo-footer').src = CONFIG_APP.logo;
        $('marca-footer').hidden = false;
      } else {
        $('marca-footer').hidden = false;
      }
    }

    var heroIndex = 0, heroTimer = null;
    function pintarHero() {
      var wrap = $('hero'), track = $('hero-track'), dots = $('hero-dots');
      if (!SLIDES.length) { wrap.hidden = true; wrap.classList.remove('visible'); return; }
      wrap.hidden = false; wrap.classList.add('visible');
      var h = '', d = '';
      for (var i = 0; i < SLIDES.length; i++) {
        var s = SLIDES[i];
        h += '<div class="hero-slide" style="background-image:url(' + esc(s.imagen) + ')">'
           + '<div class="hero-txt">'
             + (s.titulo ? '<h3>' + esc(s.titulo) + '</h3>' : '')
             + (s.subtitulo ? '<p>' + esc(s.subtitulo) + '</p>' : '')
           + '</div></div>';
        d += '<span data-i="' + i + '"' + (i === 0 ? ' class="on"' : '') + '></span>';
      }
      track.innerHTML = h;
      dots.innerHTML = d;
      heroIndex = 0; track.scrollLeft = 0;

      detenerHero();
      if (SLIDES.length > 1) {
        heroTimer = setInterval(function () {
          heroIndex = (heroIndex + 1) % SLIDES.length;
          track.scrollTo({ left: track.clientWidth * heroIndex, behavior: 'smooth' });
        }, 5000);
      }

      if (!track._listo) {
        track._listo = true;
        var tick = false;
        track.addEventListener('scroll', function () {
          if (tick) return; tick = true;
          requestAnimationFrame(function () {
            var w = track.clientWidth || 1;
            var idx = Math.round(track.scrollLeft / w);
            heroIndex = idx;
            var ds = dots.children;
            for (var i = 0; i < ds.length; i++) ds[i].className = (i === idx ? 'on' : '');
            tick = false;
          });
        }, { passive: true });
      }
    }
    function detenerHero() { if (heroTimer) { clearInterval(heroTimer); heroTimer = null; } }

    function pintarSkeletons() {
      var h = '';
      for (var i = 0; i < 6; i++) {
        h += '<div class="sk-card"><div class="sk sk-thumb"></div><div class="sk-body">'
           + '<div class="sk sk-line" style="width:75%"></div>'
           + '<div class="sk sk-line" style="width:55%"></div>'
           + '<div class="sk sk-line" style="width:35%;margin-bottom:0"></div>'
           + '</div></div>';
      }
      gridEl.innerHTML = h;
    }

    function pintarChips() {
      var l = ['Todas'].concat(CATEGORIAS), h = '';
      for (var i = 0; i < l.length; i++) h += '<button type="button" class="chip" data-cat="'
        + esc(l[i]) + '" aria-pressed="' + (l[i] === categoriaActiva ? 'true' : 'false') + '">'
        + esc(l[i]) + '</button>';
      chipsEl.innerHTML = h;
    }
    function filtrar() {
      var q = textoBusqueda.trim().toLowerCase(), out = [];
      for (var i = 0; i < TODOS.length; i++) {
        var p = TODOS[i];
        if (categoriaActiva !== 'Todas' && p.categoria !== categoriaActiva) continue;
        if (q) {
          var b = (p.nombre + ' ' + p.ingredientes.join(' ') + ' ' + p.descripcion).toLowerCase();
          if (b.indexOf(q) === -1) continue;
        }
        out.push(p);
      }
      return out;
    }
    function pintarGrid() {
      var l = filtrar();
      if (!l.length) {
        gridEl.innerHTML = '';
        estadoEl.hidden = false;
        estadoEl.textContent = 'Sin resultados. Prueba otra búsqueda.';
        return;
      }
      estadoEl.hidden = true;
      var partes = new Array(l.length);
      for (var i = 0; i < l.length; i++) partes[i] = tarjeta(l[i], i);
      gridEl.innerHTML = partes.join('');
    }
    function precioDesde(p) {
      if (p.variantes && p.variantes.length) {
        var min = p.variantes[0].precio;
        for (var i = 1; i < p.variantes.length; i++) if (p.variantes[i].precio < min) min = p.variantes[i].precio;
        return min;
      }
      return p.precio;
    }
    function tarjeta(p, i) {
      var img = p.imagen ? '<img src="' + esc(p.imagen) + '" alt="" loading="' + (i < 3 ? 'eager' : 'lazy')
        + '" decoding="async" onerror="this.remove()">' : '';
      var desde = (p.variantes && p.variantes.length) ? 'Desde ' : '';
      return '<article class="card" data-id="' + esc(p.id) + '" role="button" tabindex="0">'
        + '<div class="thumb"><span class="ph">🍕</span>' + img + '</div>'
        + '<div class="card-body">'
          + '<h2 class="card-title">' + esc(p.nombre) + '</h2>'
          + '<p class="card-ing">' + esc(p.ingredientes.join(', ')) + '</p>'
          + '<div class="card-foot">'
            + '<span class="card-price">' + desde + precio(precioDesde(p)) + '</span>'
            + '<span class="card-btn">Detalles</span>'
          + '</div></div></article>';
    }

    function abrirPanel(el) {
      ultimoFoco = document.activeElement;
      el.classList.add('abierto'); el.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      if (window.history && history.pushState) history.pushState({ panel: el.id }, '');
      setTimeout(function () {
        var b = el.querySelector('.btn-cerrar, .btn-primario, input'); if (b) b.focus();
      }, 260);
    }
    function cerrarPanel(el, desdePop) {
      if (!el.classList.contains('abierto')) return;
      el.classList.remove('abierto'); el.setAttribute('aria-hidden', 'true');
      if (!document.querySelector('.panel.abierto, .modal.abierto')) document.body.style.overflow = '';
      if (ultimoFoco && ultimoFoco.focus) { try { ultimoFoco.focus(); } catch (e) {} }
      if (!desdePop && window.history && history.state && history.state.panel) history.back();
    }
    function abrirModal(el) {
      ultimoFoco = document.activeElement;
      el.classList.add('abierto'); el.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      setTimeout(function () { var i = el.querySelector('input, button'); if (i) i.focus(); }, 80);
    }
    function cerrarModal(el) {
      el.classList.remove('abierto'); el.setAttribute('aria-hidden', 'true');
      if (!document.querySelector('.panel.abierto, .modal.abierto')) document.body.style.overflow = '';
      if (ultimoFoco && ultimoFoco.focus) { try { ultimoFoco.focus(); } catch (e) {} }
    }

    function abrirDetalle(id) {
      var p = null;
      for (var i = 0; i < TODOS.length; i++) if (TODOS[i].id === id) { p = TODOS[i]; break; }
      if (!p) return;
      productoActual = p; cantidadActual = 1;
      varianteActual = (p.variantes && p.variantes.length) ? p.variantes[0].id : null;
      $('detalle-nombre').textContent = p.nombre;
      $('detalle-cat').textContent = p.categoria || 'Producto';
      var d = $('detalle-desc'); d.textContent = p.descripcion || ''; d.style.display = p.descripcion ? '' : 'none';
      $('detalle-media').innerHTML = '<span class="ph">🍕</span>' +
        (p.imagen ? '<img src="' + esc(p.imagen) + '" alt="" decoding="async" onerror="this.remove()">' : '');
      var bv = $('bloque-variantes');
      if (p.variantes && p.variantes.length) {
        bv.hidden = false;
        var hv = '';
        for (var v = 0; v < p.variantes.length; v++) {
          var va = p.variantes[v];
          hv += '<button type="button" class="variante" data-var="' + esc(va.id) + '" '
             + 'role="radio" aria-checked="' + (va.id === varianteActual ? 'true' : 'false') + '" '
             + 'aria-pressed="' + (va.id === varianteActual ? 'true' : 'false') + '">'
             + esc(va.nombre) + '<small>' + precio(va.precio) + '</small></button>';
        }
        $('detalle-variantes').innerHTML = hv;
      } else {
        bv.hidden = true; $('detalle-variantes').innerHTML = '';
      }
      var ing = p.ingredientes, hi = '';
      if (ing.length) for (var j = 0; j < ing.length; j++) hi += '<li>' + esc(ing[j]) + '</li>';
      else hi = '<li>Consulta con el local</li>';
      $('detalle-ing').innerHTML = hi;
      actualizarPrecioDetalle();
      $('cant-num').textContent = cantidadActual;
      detalleEl.querySelector('.panel-scroll').scrollTop = 0;
      abrirPanel(detalleEl);
    }
    function precioUnitarioActual() {
      if (!productoActual) return 0;
      if (productoActual.variantes && productoActual.variantes.length && varianteActual) {
        for (var i = 0; i < productoActual.variantes.length; i++)
          if (productoActual.variantes[i].id === varianteActual) return productoActual.variantes[i].precio;
      }
      return productoActual.precio || 0;
    }
    function actualizarPrecioDetalle() {
      var u = precioUnitarioActual();
      $('detalle-precio').textContent = precio(u);
      $('precio-agregar').textContent = precio(u * cantidadActual);
    }

    function agregarAlCarrito(p, vId, cant) {
      var pu = p.precio || 0, vn = '';
      if (vId && p.variantes) for (var i = 0; i < p.variantes.length; i++)
        if (p.variantes[i].id === vId) { pu = p.variantes[i].precio; vn = p.variantes[i].nombre; break; }
      var key = claveItem(p.id, vId), max = CONFIG_APP.maxCantidad || 20;
      for (var k = 0; k < CARRITO.length; k++) {
        if (CARRITO[k].key === key) {
          CARRITO[k].cantidad = Math.min(CARRITO[k].cantidad + cant, max);
          guardarCarritoLS(); actualizarBadge(); return;
        }
      }
      if (CARRITO.length >= (CONFIG_APP.maxItems || 40)) { toast('Máximo alcanzado'); return; }
      CARRITO.push({ key: key, id: p.id, nombre: p.nombre, variante: vId || '',
        varianteNombre: vn, precio: pu, cantidad: Math.min(cant, max) });
      guardarCarritoLS(); actualizarBadge();
    }
    function cambiarCantidad(key, delta) {
      for (var i = 0; i < CARRITO.length; i++) {
        if (CARRITO[i].key === key) {
          CARRITO[i].cantidad += delta;
          if (CARRITO[i].cantidad <= 0) CARRITO.splice(i, 1);
          else if (CARRITO[i].cantidad > (CONFIG_APP.maxCantidad || 20))
            CARRITO[i].cantidad = CONFIG_APP.maxCantidad || 20;
          break;
        }
      }
      guardarCarritoLS(); actualizarBadge(); pintarCarrito();
    }
    function vaciarCarrito() {
      CARRITO = []; pedidoActualNumero = null;
      guardarCarritoLS(); escribirLS(LS_PEDIDO, null);
      actualizarBadge(); pintarCarrito();
    }
    function totalCarrito() { var t = 0; for (var i = 0; i < CARRITO.length; i++) t += CARRITO[i].precio * CARRITO[i].cantidad; return t; }
    function contarItems() { var t = 0; for (var i = 0; i < CARRITO.length; i++) t += CARRITO[i].cantidad; return t; }
    function actualizarBadge() {
      var n = contarItems(), b = $('badge');
      if (n > 0) { b.hidden = false; b.textContent = n > 99 ? '99+' : n; }
      else b.hidden = true;
      if (n > 0) {
        $('fab-count').textContent = n;
        $('fab-total').textContent = precio(totalCarrito());
        fabEl.classList.add('visible');
      } else fabEl.classList.remove('visible');
    }
    function guardarCarritoLS() { escribirLS(LS_CARRITO, CARRITO); }
    function pintarCarrito() {
      var l = $('carrito-lista');
      if (!CARRITO.length) {
        l.innerHTML = '<div class="carrito-vacio"><span class="icono">🛒</span>Tu carrito está vacío.</div>';
      } else {
        var h = '';

    function construirMensaje(totalReal) {
      var L = ['*Nuevo pedido — ' + CONFIG_APP.negocio + '*'];

      L.push('');
      var n = $('c-nombre').value.trim(), t = $('c-telefono').value.trim();
      var d = $('c-direccion').value.trim(), no = $('c-notas').value.trim();
      if (n) L.push('Cliente: ' + n);
      if (t) L.push('Teléfono: ' + t);
      if (d) L.push('Dirección: ' + d);
      if (no) L.push('Notas: ' + no);
      if (n || t || d || no) L.push('');
      L.push('*Detalle:*');
      for (var i = 0; i < CARRITO.length; i++) {
        var it = CARRITO[i];
        L.push('• ' + it.cantidad + 'x ' + it.nombre
          + (it.varianteNombre ? ' (' + it.varianteNombre + ')' : '')
          + ' — ' + precio(it.precio * it.cantidad));

      L.push('');

    function conReintentos(fn, n, e) {
      n = n || 3; e = e || 800;
      return new Promise(function (res, rej) {
        function go(k) {
          fn().then(res).catch(function (err) {
            if (k <= 1) return rej(err);
            setTimeout(function () { go(k - 1); }, e * (4 - k));
          });
        }
        go(n);
      });

    function manejarArchivo(e) {

      var lim = adminEditandoTipo === 'slide' ? 5 : 3;
      if (f.size > lim * 1024 * 1024) { toast('Máx ' + lim + ' MB'); return; }

      toast('Subiendo…');
      var tipo = adminEditandoTipo, id = adminEditandoId, fila = adminEditandoFila;
      adminEditandoTipo = adminEditandoId = adminEditandoFila = null;

      var reader = new FileReader();
      reader.onload = function () {
        var dataUrl = String(reader.result);
        var idx = dataUrl.indexOf(',');
        var base64 = idx > -1 ? dataUrl.substring(idx + 1) : '';

        var runner = google.script.run
          .withSuccessHandler(function (r) {
            if (r && r.ok) {
              toast('Imagen actualizada ✓');
              if (tipo === 'producto') {
                var row = document.querySelector('.admin-row[data-id="' + id + '"]');

                if (row2) { var t2 = row2.querySelector('.admin-thumb'); if (t2) t2.innerHTML = '<img src="' + esc(r.url) + '" alt="">'; }
              }
              cargarCatalogo();
            } else toast('Error: ' + ((r && r.error) || ''));
          })
          .withFailureHandler(function () { toast('Error de conexión'); });

        if (tipo === 'producto') runner.subirImagenAdmin(PIN_ADMIN, id, base64, f.type, f.name || ('img_' + Date.now() + '.jpg'));
        else runner.subirImagenSlideAdmin(PIN_ADMIN, fila, base64, f.type, f.name || ('slide_' + Date.now() + '.jpg'));
      };
      reader.onerror = function () { toast('No se pudo leer el archivo'); };
      reader.readAsDataURL(f);
    }

      if (!productoActual) return;
      agregarAlCarrito(productoActual, varianteActual, cantidadActual);
      toast('Agregado al carrito ✓');
      var b = this, o = b.innerHTML;
      b.innerHTML = '✓ Agregado'; b.disabled = true;
      setTimeout(function () { b.innerHTML = o; b.disabled = false; }, 800);
    });

    $('btn-carrito-top').addEventListener('click', abrirCarrito);
    fabEl.addEventListener('click', abrirCarrito);
    $('cerrar-carrito').addEventListener('click', function () { cerrarPanel(carritoEl, false); });
    $('carrito-lista').addEventListener('click', function (e) {
      var btn = padre(e.target, 'ci-btn'); if (!btn) return;
      var item = padre(btn, 'carrito-item'); if (!item) return;
      cambiarCantidad(item.getAttribute('data-key'), btn.getAttribute('data-accion') === 'mas' ? 1 : -1);
    });
    $('btn-vaciar').addEventListener('click', function () {
      if (!CARRITO.length) return;
      if (window.confirm('¿Vaciar todo el carrito?')) vaciarCarrito();
    });
    $('btn-guardar').addEventListener('click', guardarPedido);
    $('btn-wa').addEventListener('click', enviarWhatsApp);
    ['c-nombre','c-telefono','c-direccion','c-notas'].forEach(function (id) {
      $(id).addEventListener('change', guardarClienteLS);
      $(id).addEventListener('blur', guardarClienteLS);
    });

    $('btn-estado').addEventListener('click', abrirModalEstado);
    $('btn-modal-cerrar').addEventListener('click', function () { cerrarModal(modalEst); });
    $('btn-modal-buscar').addEventListener('click', buscarEstado);
    $('input-numero').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); buscarEstado(); }
    });
    modalEst.addEventListener('click', function (e) { if (e.target === modalEst) cerrarModal(modalEst); });

    $('btn-admin').addEventListener('click', function () {
      if (PIN_ADMIN) abrirPanelAdmin(); else abrirModalPin();
    });
    $('btn-pin-cerrar').addEventListener('click', function () { cerrarModal(modalPin); });
    $('btn-pin-entrar').addEventListener('click', intentarLogin);
    $('input-pin').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); intentarLogin(); }
    });
    modalPin.addEventListener('click', function (e) { if (e.target === modalPin) cerrarModal(modalPin); });

    $('cerrar-admin').addEventListener('click', function () { cerrarPanel(panelAdminEl, false); });
    $('btn-admin-logout').addEventListener('click', cerrarSesionAdmin);
    $('btn-nuevo-producto').addEventListener('click', crearProducto);

    document.querySelectorAll('.admin-tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        adminTab = tab.getAttribute('data-tab');
        document.querySelectorAll('.admin-tab').forEach(function (t) {
          t.classList.toggle('on', t === tab);
        });
        cargarAdminActual();
      });
    });

    $('admin-lista').addEventListener('click', function (e) {
      var thumb = padre(e.target, 'admin-thumb');
      if (thumb) {
        var row = padre(thumb, 'admin-row');
        if (adminTab === 'productos') elegirImagen('producto', row.getAttribute('data-id'));
        else elegirImagen('slide', Number(row.getAttribute('data-fila')));
        return;
      }
      var btn = padre(e.target, 'admin-btn');
      if (!btn) return;
      var row2 = padre(btn, 'admin-row');
      if (!row2) return;
      var acc = btn.getAttribute('data-accion');
      if (acc === 'guardar') guardarFilaAdmin(row2);
      else if (acc === 'toggle') toggleDisponible(row2);
      else if (acc === 'eliminar') eliminarProducto(row2);
      else if (acc === 'guardar-slide') guardarFilaSlide(row2);
      else if (acc === 'toggle-slide') toggleSlide(row2);
      else if (acc === 'imagen-slide') elegirImagen('slide', Number(row2.getAttribute('data-fila')));
    });
    fileInput.addEventListener('change', manejarArchivo);

    window.addEventListener('popstate', function () {
      if (panelAdminEl.classList.contains('abierto')) return;
      if (modalPin.classList.contains('abierto')) { cerrarModal(modalPin); return; }
      if (modalEst.classList.contains('abierto')) { cerrarModal(modalEst); return; }
      if (carritoEl.classList.contains('abierto')) cerrarPanel(carritoEl, true);
      else if (detalleEl.classList.contains('abierto')) cerrarPanel(detalleEl, true);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Tab') {
        if (panelAdminEl.classList.contains('abierto')) trapFocus(panelAdminEl, e);
        else if (modalPin.classList.contains('abierto')) trapFocus(modalPin, e);
        else if (modalEst.classList.contains('abierto')) trapFocus(modalEst, e);
        else if (carritoEl.classList.contains('abierto')) trapFocus(carritoEl, e);
        else if (detalleEl.classList.contains('abierto')) trapFocus(detalleEl, e);
      } else if (e.key === 'Escape') {
        if (panelAdminEl.classList.contains('abierto')) cerrarPanel(panelAdminEl, false);
        else if (modalPin.classList.contains('abierto')) cerrarModal(modalPin);
        else if (modalEst.classList.contains('abierto')) cerrarModal(modalEst);
        else if (carritoEl.classList.contains('abierto')) cerrarPanel(carritoEl, false);
        else if (detalleEl.classList.contains('abierto')) cerrarPanel(detalleEl, false);
      }
    });

    iniciar();
  })();
  </script>
</body>
</html>
